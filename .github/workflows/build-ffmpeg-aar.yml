name: Build Media3 1.4.1 FFmpeg AAR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pluscast repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ffmpeg pkg-config yasm nasm curl unzip

      - name: Download and extract Android NDK r26b
        run: |
          curl -fsSL "https://dl.google.com/android/repository/android-ndk-r26b-linux.zip" -o "$HOME/ndk.zip"
          unzip -q "$HOME/ndk.zip" -d "$HOME/ndk-bundle"

      - name: Clone Media3 1.4.1
        run: |
          git clone --depth 1 --branch 1.4.1 https://github.com/androidx/media.git media3

      - name: Build FFmpeg native libs and decoder AAR
        env:
          ENABLED_DECODERS: "mp2 mp2float mp3 ac3 eac3 dca"
        run: |
          NDK_DIR="$HOME/ndk-bundle/android-ndk-r26b"
          MODULE_DIR="$GITHUB_WORKSPACE/media3/libraries/decoder_ffmpeg/src/main"
          JNI_DIR="$MODULE_DIR/jni"

          git clone --depth 1 --branch n6.1.2 https://git.ffmpeg.org/ffmpeg.git "$JNI_DIR/ffmpeg"

          cd "$JNI_DIR"
          sed -i '/--disable-postproc/d' build_ffmpeg.sh

          python3 - <<'EOF'
          from pathlib import Path

          # 1. Fix Android stderr macro conflict in FFmpeg log.c
          log_c = Path("ffmpeg/libavutil/log.c")
          text = log_c.read_text(encoding="utf-8")

          guard = """
          #ifdef __ANDROID__
          #include <stdio.h>
          static FILE *pluscast_stderr_fallback = NULL;
          #undef stderr
          #define stderr (pluscast_stderr_fallback ? pluscast_stderr_fallback : (pluscast_stderr_fallback = fopen("/dev/null", "w")))
          #endif
          """

          if "pluscast_stderr_fallback" not in text:
              marker = "#include \"log.h\""
              if marker in text:
                  text = text.replace(marker, marker + "\n" + guard, 1)
              else:
                  text = guard + "\n" + text
              log_c.write_text(text, encoding="utf-8")

          # 2. Explicitly enable mp2 / mp2float and requested decoders in build_ffmpeg.sh
          script_path = Path("build_ffmpeg.sh")
          script_text = script_path.read_text(encoding="utf-8")

          extra_flags = (
              " \\\n"
              "  --enable-decoder=mp2 \\\n"
              "  --enable-decoder=mp2float \\\n"
              "  --enable-decoder=mp3 \\\n"
              "  --enable-decoder=ac3 \\\n"
              "  --enable-decoder=eac3 \\\n"
              "  --enable-decoder=dca"
          )

          if "--enable-decoder=mp2" not in script_text:
              if "--disable-everything" in script_text:
                  script_text = script_text.replace(
                      "--disable-everything",
                      "--disable-everything" + extra_flags,
                      1,
                  )
              elif "--enable-decoders" in script_text:
                  script_text = script_text.replace(
                      "--enable-decoders",
                      extra_flags.lstrip() + " \\\n  --enable-decoders",
                      1,
                  )

          script_path.write_text(script_text, encoding="utf-8")
          EOF

          for abi in arm64-v8a armeabi-v7a; do
            ANDROID_ABI="$abi" ./build_ffmpeg.sh "$MODULE_DIR" "$NDK_DIR" "linux-x86_64" "24"
            echo "=== Checking MP2 decoder config for $abi ==="
            grep -E "CONFIG_MP2_DECODER|CONFIG_MP2FLOAT_DECODER" "$JNI_DIR/ffmpeg/ffbuild/config.h" || true
          done

          cd "$GITHUB_WORKSPACE/media3"
          ./gradlew :lib-decoder-ffmpeg:bundleReleaseAar --no-daemon

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: media3-1.4.1-ffmpeg-aar
          path: media3/**/outputs/aar/*.aar
