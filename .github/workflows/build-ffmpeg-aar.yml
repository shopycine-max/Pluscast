name: Build Media3 1.4.1 FFmpeg AAR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout Pluscast repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK and SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "ndk;26.1.10909125" "platforms;android-34" "build-tools;34.0.0"

      - name: Install build tools (cmake, ninja, ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ffmpeg pkg-config yasm nasm curl

      - name: Clone Media3 1.4.1
        run: |
          git clone --depth 1 --branch 1.4.1 https://github.com/androidx/media.git media3

      - name: Build FFmpeg native libs and decoder AAR
        env:
          FFMPEG_PATH: $HOME/ffmpeg
        run: |
          git clone --depth 1 https://git.ffmpeg.org/ffmpeg.git "$FFMPEG_PATH"

          NDK_DIR="/usr/local/lib/android/sdk/ndk/26.1.10909125"
          if [ ! -d "$NDK_DIR" ]; then
            NDK_DIR=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | head -n 1)
          fi
          echo "Using NDK_DIR: $NDK_DIR"

          cd media3/libraries/decoder_ffmpeg/src/main/jni
          DECODERS="mp2 mp2float mp3 ac3 eac3 dca"
          for abi in arm64-v8a armeabi-v7a; do
            ./build_ffmpeg.sh "$FFMPEG_PATH" "$NDK_DIR" "$abi" "$DECODERS"
          done

          cd "$GITHUB_WORKSPACE/media3"
          ./gradlew :libraries:decoder_ffmpeg:bundleReleaseAar

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: media3-1.4.1-ffmpeg-aar
          path: media3/libraries/decoder_ffmpeg/build/outputs/aar/*.aar
