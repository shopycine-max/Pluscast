name: Build PlusCast Debug APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission for gradlew (if present)
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build Debug APK
        run: |
          set -o pipefail
          if [ -f "./gradlew" ]; then
            GRADLE_CMD="./gradlew"
          else
            GRADLE_CMD="gradle"
          fi

          $GRADLE_CMD :app:assembleDebug --stacktrace | tee build.log || {
            echo "=== MAIN BUILD ERRORS ==="
            grep -E "e:|FAILURE:|Caused by:|Execution failed|A problem occurred|error:" build.log | tail -n 40
            exit 1
          }

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PlusCast-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
