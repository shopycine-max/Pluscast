name: Build PlusCast Debug APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission for gradlew (if present)
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build Debug APK
        run: |
          set -o pipefail
          echo "=== ALL FILES UNDER app/src/main/res ==="
          find app/src/main/res -maxdepth 4 -ls || true

          if [ -f "./gradlew" ]; then
            GRADLE_CMD="./gradlew"
          else
            GRADLE_CMD="gradle"
          fi

          $GRADLE_CMD :app:assembleDebug --console=plain > build.log 2>&1 || {
            echo "=== RESOURCE / GRADLE ERRORS ==="
            grep -nE "ERROR:|Error:|error:|AAPT:|linking failed|Execution failed|Caused by:|Unresolved|expecting|cannot find symbol" build.log | head -n 50
            echo "=== LAST 35 LINES ==="
            tail -n 35 build.log
            exit 1
          }

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PlusCast-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
