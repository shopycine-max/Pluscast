      - name: Build Debug APK
        run: |
          set -o pipefail
          if [ -f "./gradlew" ]; then
            GRADLE_CMD="./gradlew"
          else
            GRADLE_CMD="gradle"
          fi

          $GRADLE_CMD :app:assembleDebug | tee build.log || {
            echo "=== EXACT COMPILER ERRORS ==="
            grep -E "^e:|Caused by:|Execution failed for task" build.log | tail -n 35
            exit 1
          }
